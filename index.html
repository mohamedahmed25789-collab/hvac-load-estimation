function meta(){return [['project','اسم المشروع'],['building','المبنى'],['floor','الدور']].map(([k,v])=>input(v,k,state[k])).join('')}
function show(key){tab=key;for(const id of ['rooms','systems','review'])$(id).hidden=id!==tab;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));refresh()}
function refresh(){ if(state.auto&&tab==='review'){calculateAuto();save()} $('dashboard').innerHTML=stats(); if(tab==='rooms')renderRooms();if(tab==='systems'){if(state.auto!==false){state.auto=true;autoView()}else{renderSystems();$('systems').insertAdjacentHTML('afterbegin','<button class="primary" onclick="startAutomatic()">اختيار تلقائي</button>')}}if(tab==='review')renderReport() }
function countChange(k,val,el){
 const rooms=k==='rc',arr=rooms?state.rooms:state.systems;
 if(!whole(val,1,rooms?1000:100)){el.value=arr.length;return}
 if(val<arr.length&&!confirm(rooms?'حذف الفراغات الأخيرة وتوزيعاتها؟':'إزالة الأنظمة الأخيرة وإعادة وحداتها إلى غير المسند؟')){el.value=arr.length;return}
 if(val<arr.length){arr.length=val;if(!rooms)state.rooms.forEach(r=>r.alloc=r.alloc.slice(0,val))}
 while(arr.length<val)arr.push(rooms?room(arr.length):system());
 save();refresh()
}
function syncRoomResults(el){
 // Keep the active editor mounted while typing, including an incomplete decimal.
 const rIndex=Number(el.dataset.r),old=$('rooms'),tmp=document.createElement('div');
 const active=old.firstElementChild,oldRows=active.querySelectorAll('tbody tr');
 const opened=new Set([...old.querySelectorAll('details[open] summary')].map(x=>x.textContent));
 renderRooms(tmp);
 const fresh=tmp.querySelectorAll('tbody tr')[rIndex],existing=oldRows[rIndex];
 for(const i of [4,5,6,7,8]){
  if(i===6)existing.cells[i].querySelector('small').innerHTML=fresh.cells[i].querySelector('small').innerHTML;
  else existing.cells[i].innerHTML=fresh.cells[i].innerHTML
 }
 active.querySelector('[data-key=rc]').value=state.rooms.length;
 old.querySelectorAll('h3,details').forEach(x=>x.remove());old.append(...Array.from(tmp.children).slice(1));old.querySelectorAll('details').forEach(d=>d.open=opened.has(d.querySelector('summary').textContent));
 el.focus({preventScroll:true})
}
function onEdit(e){
 const el=e.target,k=el.dataset.key;if(!k)return;
 if(['rc','sc'].includes(k)){if(e.type==='change')countChange(k,Number(el.value),el);return}
 if(el.tagName==='SELECT'&&e.type!=='change')return;
 if(el.tagName!=='SELECT'&&e.type==='change'&&el.value!==''&&el.validity.valid)return;
 if(['project','building','floor'].includes(k)){state[k]=el.value;save();if(tab==='review')renderReport();return}
 const i=Number(el.dataset.r),j=Number(el.dataset.j),r=state.rooms[i],s=state.systems[j];
 if(k==='name'){r.name=el.value;save();return}
 if(k==='area'||k==='n'||k==='alloc'){
  if(el.validity.badInput||el.value===''&&e.type==='input'&&k!=='area')return;
  let n=Number(el.value);const lo=Number(el.min),hi=Number(el.max);
  if(!Number.isFinite(n))return;
  if(n<lo||n>hi||k!=='area'&&!Number.isInteger(n)){if(e.type==='input'){el.setCustomValidity('أدخل قيمة ضمن الحدود المتاحة');return}n=Math.max(lo,Math.min(hi,k==='area'?n:Math.floor(n)));el.value=n}
  el.setCustomValidity('');if(el.value===''&&e.type==='change')el.value=n;
  if(k==='alloc'){while(r.alloc.length<=j)r.alloc.push(0);r.alloc[j]=n}
  else{r[k]=n;if(k==='n'){let left=n;r.alloc=r.alloc.map(a=>{const v=Math.min(left,a);left-=v;return v})}}
 }else if(k==='type'){r.type=el.value;r.manual=''}
 else if(k==='rule'){r.rule=el.value;r.manual=''}
 else if(k==='manual')r.manual=el.value;
 else if(k==='series')s.series=el.value;
 else if(k==='mods')s.mods=Number(el.value);

// Rank the shared indoor ratings by total absolute room-level deviation.
// Optimize outdoor choices independently for each connected group.
function planOutdoor(rooms,k){
 const total=sum(rooms,r=>r.n);
 if(rooms.some(r=>!(r.area>0)))return {error:'أدخل مساحة كل فراغ لاستكمال الحساب.'};
 if(k>total)return {error:'عدد الخارجيات أكبر من عدد الوحدات الداخلية. يجب توصيل داخلية واحدة على الأقل بكل خارجية.'};
 const outdoor=O.filter(m=>m.mods.length===1);
 if(total>k*Math.max(...outdoor.map(m=>m.max)))return {error:'عدد الداخليات يتجاوز الحد الأقصى المتاح للخارجيات المنفردة المطلوبة.'};
 const selected=rooms.map(model);if(selected.some(m=>!m))return {error:"أحد الفراغات يتجاوز أكبر قدرة داخلية متاحة وفق طريقة الاختيار. راجع عدد الأجهزة أو نوع الوحدة."};
 const maxCount=Math.max(...outdoor.map(o=>o.max));
 const order=rooms.map((r,i)=>({i,q:r.area*1000/r.n,n:r.n})).sort((a,b)=>a.q-b.q);
 const ids=[],prefix=[0],capacity=[0];
 for(const r of order)for(let n=0;n<r.n;n++){ids.push(r.i);prefix.push(prefix.at(-1)+r.q);capacity.push(capacity.at(-1)+selected[r.i].kw)}
 function solve(pool){
 function pick(n,load,kw){let win=null;for(const o of pool){
  if(n>o.max||kw*100<50*o.kw-1e-7||kw*100>130*o.kw+1e-7)continue;
  const diff=Math.abs(o.bt-load);if(!win||diff<win.diff||diff===win.diff&&(o.bt>win.o.bt||o.bt===win.o.bt&&o.power<win.o.power))win={o,diff}
 }return win}
  let groups=null,cost=Infinity;
  // For small selections enumerate every unordered partition, including mixed room loads.
  if(total<=10){
   const bins=[];function visit(i){if(i===total){if(bins.length!==k)return;let d=0;const g=[];for(const bin of bins){const p=pick(bin.length,sum(bin,x=>rooms[x].area*1000/rooms[x].n),sum(bin,x=>selected[x].kw));if(!p)return;d+=p.diff;g.push({ids:[...bin],m:p.o})}if(d<cost){cost=d;groups=g}return}
    if(total-i<k-bins.length)return;
    for(const bin of bins){if(bin.length>=maxCount)continue;bin.push(ids[i]);visit(i+1);bin.pop()}
    if(bins.length<k){bins.push([ids[i]]);visit(i+1);bins.pop()}
   }visit(0)
  }else{
   let prev=new Map([[0,{cost:0}]]);for(let j=1;j<=k&&prev.size;j++){const next=new Map();
    for(const [start,rec] of prev)for(let n=1;n<=maxCount;n++){const end=start+n,remain=total-end;if(remain<k-j)break;if(remain>(k-j)*maxCount)continue;
     const p=pick(n,prefix[end]-prefix[start],capacity[end]-capacity[start]);if(!p)continue;const d=rec.cost+p.diff;if(!next.has(end)||d<next.get(end).cost)next.set(end,{cost:d,start,end,m:p.o,prev:rec})
    }prev=next}
   let last=prev.get(total);if(last){cost=last.cost;groups=[];while(last.m){groups.unshift({ids:ids.slice(last.start,last.end),m:last.m});last=last.prev}}
  }
 return groups?{groups,cost,exact:total<=10}:null
 }
 const base=solve(outdoor);
 if(base&&k>1){
  const spread=plan=>Math.max(...plan.groups.map(g=>g.m.hp))-Math.min(...plan.groups.map(g=>g.m.hp));
  const target=prefix[total],limit=base.cost+target*.02;
  const sizes=[...new Set(outdoor.map(o=>o.hp))].sort((a,b)=>a-b);
  const windows=[];for(const lo of sizes)for(const hi of sizes)if(hi>=lo&&hi-lo<spread(base))windows.push([lo,hi]);
  windows.sort((a,b)=>(a[1]-a[0])-(b[1]-b[0]));
  let best=base;
  for(const [lo,hi] of windows){
   if(hi-lo>spread(best))break;
   const pool=outdoor.filter(o=>o.hp>=lo&&o.hp<=hi);
   if(k*Math.min(...pool.map(o=>o.bt))>target+limit||k*Math.max(...pool.map(o=>o.bt))<target-limit)continue;
   const plan=solve(pool);if(plan&&plan.cost<=limit&&(spread(plan)<spread(best)||spread(plan)===spread(best)&&plan.cost<best.cost))best=plan;
  }
  return best
 }
 return base||{error:'تعذّر إيجاد توزيع للخارجيات بالعدد المطلوب يحقق حدود التوصيل والعدد للقدرات الداخلية المختارة لكل فراغ.'}
}
let autoCache='',autoResult=null;
function calculateAuto(){
 const key=JSON.stringify([state.rooms.map(r=>[r.area,r.n,r.type,r.manual,r.rule]),state.systems.length]);
 if(key!==autoCache){autoResult=planOutdoor(state.rooms,state.systems.length);autoCache=key}
 const p=autoResult;state.rooms.forEach(r=>{r.alloc=[]});
 if(!p.error)p.groups.forEach((g,j)=>{state.systems[j]={series:g.m.series,mods:1,selectedCode:g.m.code};for(const i of g.ids){const a=state.rooms[i].alloc;while(a.length<=j)a.push(0);a[j]++}});
 return p
}

}

}
